name: Release APK

# Cuts a GitHub Release with a built APK whenever the version in package.json
# changes. `/commit pushnbump` bumps package.json and pushes to master, so this
# fires automatically: read the version, and if no `v<version>` tag/release
# exists yet, build the APK and publish the release (which also creates the tag).
# A normal push that does not change the version finds the tag already present
# and skips the build, so only version bumps produce releases.
#
# Both the APK and the Play app bundle are signed with the upload keystore, so
# every build has the same certificate and native Google sign-in keeps working
# (the OAuth Android client is registered against that SHA-1). They are wired to
# the cloud Supabase backend so the mobile app shares account data with the web
# app. The bundle also goes to the Play internal testing track.
#
# Repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64           - base64 of the upload keystore (.jks)
#   STORE_PASSWORD            - keystore password
#   KEY_ALIAS                 - key alias
#   KEY_PASSWORD              - key password
#   GOOGLE_WEB_CLIENT_ID      - Google OAuth web client id (shows the Google button)
#   PLAY_SERVICE_ACCOUNT_JSON - Play Console service-account JSON; the Play
#                               upload step is skipped while it is unset

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.3"

permissions:
  # Required so softprops/action-gh-release can create the tag + Release.
  contents: write

jobs:
  # Decide whether this version still needs a release (gate the heavy build).
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      should_release: ${{ steps.tag.outputs.exists == 'false' }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Play rejects a bundle whose versionCode is not higher than every earlier
      # upload, so derive it from the semver: 0.1.0 -> 100, 1.2.3 -> 10203.
      # Minor and patch must stay below 100 for the order to hold.
      - name: Read version from package.json
        id: ver
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "version_code=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")" >> "$GITHUB_OUTPUT"

      - name: Does the tag already exist?
        id: tag
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists - skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag for v${{ steps.ver.outputs.version }} yet - will build + release."
          fi

  release:
    name: Build APK + bundle and publish release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets cannot be tested in `if:` directly, so surface this one as env.
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # Generated sources (freezed / json_serializable / drift) are gitignored,
      # so regenerate them before building.
      - name: Generate models code
        working-directory: packages/models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate data code
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      # build.gradle.kts signs release builds with key.properties when present.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/app/android/app/upload-keystore.jks

      # Secrets go through env, not inline ${{ }}, so a quote, $ or backtick
      # in a password reaches the file verbatim instead of being parsed by bash.
      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=upload-keystore.jks\n' >  apps/app/android/key.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> apps/app/android/key.properties
          printf 'keyAlias=%s\n'      "$KEY_ALIAS"      >> apps/app/android/key.properties
          printf 'keyPassword=%s\n'   "$KEY_PASSWORD"   >> apps/app/android/key.properties

      # Secrets are injected at build time; if unset they expand to empty and
      # the app runs without that feature. The version name is stamped from
      # package.json so the installed app matches the release tag.
      - name: Build signed APK
        working-directory: apps/app
        run: >
          flutter build apk --release
          --build-name=${{ needs.check.outputs.version }}
          --build-number=${{ needs.check.outputs.version_code }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Build signed app bundle
        working-directory: apps/app
        run: >
          flutter build appbundle --release
          --build-name=${{ needs.check.outputs.version }}
          --build-number=${{ needs.check.outputs.version_code }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Rename APK
        run: cp apps/app/build/app/outputs/flutter-apk/app-release.apk "joes-tabs-${{ needs.check.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: joes-tabs-apk
          path: joes-tabs-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

      # Runs before the GitHub Release on purpose: the release creates the
      # v<version> tag, and the check job skips any version whose tag exists,
      # so a Play failure after tagging could never be retried by a re-run.
      # Pinned to the v1.1.5 commit so a moved tag cannot swap in other code.
      - name: Upload to Google Play (internal track)
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sirbepy.joestabs
          releaseFiles: apps/app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: joes-tabs-${{ needs.check.outputs.version }}.apk
          generate_release_notes: true
