name: Release APK

# Cuts a GitHub Release with a built APK whenever the version in package.json
# changes. `/commit pushnbump` bumps package.json and pushes to master, so this
# fires automatically: read the version, and if no `v<version>` tag/release
# exists yet, build the APK and publish the release (which also creates the tag).
# A normal push that does not change the version finds the tag already present
# and skips the build, so only version bumps produce releases.
#
# Today this builds an UNSIGNED debug APK (no release keystore yet). It is wired
# to the cloud Supabase backend so the mobile app shares account data with the
# web app.
#
# WHEN A RELEASE KEYSTORE EXISTS (provided later by Joe):
#   Add these repository secrets in GitHub > Settings > Secrets and variables
#   > Actions, then enable the commented-out signed-build steps below:
#     KEYSTORE_BASE64  - base64 of the upload keystore (.jks)
#     STORE_PASSWORD   - keystore password
#     KEY_ALIAS        - key alias
#     KEY_PASSWORD     - key password
#   For Play Store upload, also add:
#     PLAY_SERVICE_ACCOUNT_JSON - Google Play service-account JSON

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.3"

permissions:
  # Required so softprops/action-gh-release can create the tag + Release.
  contents: write

jobs:
  # Decide whether this version still needs a release (gate the heavy build).
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.tag.outputs.exists == 'false' }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Does the tag already exist?
        id: tag
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists - skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag for v${{ steps.ver.outputs.version }} yet - will build + release."
          fi

  release:
    name: Build APK and publish release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # Generated sources (freezed / json_serializable / drift) are gitignored,
      # so regenerate them before building.
      - name: Generate models code
        working-directory: packages/models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate data code
        working-directory: packages/data
        run: dart run build_runner build --delete-conflicting-outputs

      # ----------------------------------------------------------------------
      # SIGNED RELEASE BUILD (enable once keystore + secrets exist).
      # Decode the keystore and write key.properties, then build appbundle.
      # ----------------------------------------------------------------------
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/app/android/app/upload-keystore.jks
      #
      # - name: Write key.properties
      #   run: |
      #     printf 'storeFile=upload-keystore.jks\n' >  apps/app/android/key.properties
      #     printf 'storePassword=%s\n' "${{ secrets.STORE_PASSWORD }}" >> apps/app/android/key.properties
      #     printf 'keyAlias=%s\n'      "${{ secrets.KEY_ALIAS }}"      >> apps/app/android/key.properties
      #     printf 'keyPassword=%s\n'   "${{ secrets.KEY_PASSWORD }}"   >> apps/app/android/key.properties
      #
      # - name: Build signed app bundle
      #   working-directory: apps/app
      #   run: >
      #     flutter build appbundle --release
      #     --build-name=${{ needs.check.outputs.version }}
      #     --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
      #     --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # The released APK connects to the cloud backend so mobile shares the same
      # account data as the web app. Secrets are injected at build time; if unset
      # they expand to empty and the app runs without a backend. The version name
      # is stamped from package.json so the installed app matches the release tag.
      - name: Build debug APK
        working-directory: apps/app
        run: >
          flutter build apk --debug
          --build-name=${{ needs.check.outputs.version }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: cp apps/app/build/app/outputs/flutter-apk/app-debug.apk "joes-tabs-${{ needs.check.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: joes-tabs-apk
          path: joes-tabs-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

      - name: Create release and attach APK
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: joes-tabs-${{ needs.check.outputs.version }}.apk
          generate_release_notes: true

      # ----------------------------------------------------------------------
      # PLAY STORE UPLOAD (enable once a signed app bundle + service account
      # exist). Uploads the .aab to the internal track for review.
      # ----------------------------------------------------------------------
      # - name: Upload to Google Play (internal track)
      #   uses: r0adkll/upload-google-play@v1.1.3
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.example.joes_tabs
      #     releaseFiles: apps/app/build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed
