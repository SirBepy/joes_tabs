name: Deploy Web (GitHub Pages)

# Builds the Flutter web app and deploys it to GitHub Pages on push to the
# default branch.
#
# REQUIRES one-time setup by Joe:
#   GitHub > Settings > Pages > Build and deployment > Source: GitHub Actions.
# Until Pages is enabled, the deploy step will fail; the build step still
# validates the web bundle.
#
# Base href: GitHub Pages serves project sites under /<repo>/, so the build
# sets --base-href accordingly. For a user/org root site, change to "/".

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.3"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # Supabase values are injected at compile time from repo secrets. If the
      # secrets are unset they expand to empty strings, so the build still
      # succeeds (the app runs without a backend) and the workflow is never
      # blocked. The hosted site only has a live backend once both secrets are
      # set under Settings > Secrets and variables > Actions.
      - name: Build web
        working-directory: apps/app
        run: >
          flutter build web --release
          --base-href=/joes_tabs/
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # SPA deep-link fallback. The app uses path-based URL routing, so a direct
      # load or refresh of a deep link (e.g. /joes_tabs/song/<id>) hits a path
      # GitHub Pages has no static file for and would normally 404. Pages serves
      # 404.html for any unknown path, so copying the built index.html to
      # 404.html lets Flutter's router take over and resolve the route client
      # side. index.html is copied verbatim, so the baked-in base href and the
      # real bootstrap stay correct.
      - name: Add SPA deep-link fallback (404.html)
        run: cp apps/app/build/web/index.html apps/app/build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
